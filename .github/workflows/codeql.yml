name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 毎週月曜日の朝9時に実行（新しい脆弱性DBでスキャン）
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript-typescript', 'python', 'ruby' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    # CodeQL ツールの初期化
    - name: Initialize CodeQL
      uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
      with:
        languages: ${{ matrix.language }}
        # セキュリティと品質の両方をチェック
        queries: security-and-quality

    # CodeQL 分析の実行
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
      with:
        category: "/language:${{matrix.language}}"